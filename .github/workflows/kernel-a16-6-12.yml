name: 内核构建 - Android 16 (6.12改)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 下拉选项 ====================
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - Official
          - Next
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - BakaSU
        default: Next
      ksu_mode:
        description: "KernelSU / SUSFS 模式"
        required: true
        type: choice
        options:
          - 关闭
          - 禁用SUSFS
          - 禁用KSU
        default: 关闭
      use_kpm:
        description: "KPM 功能（patched 尚不支持）"
        required: true
        type: choice
        default: "disabled (关闭)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补，尚不支持)"
      droidspaces:
        description: "Droidspaces 容器支持"
        required: false
        type: choice
        options:
          - "off"
          - "on"
        default: "off"
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "仅上传 AnyKernel3.zip"

      # ★ ==================== 编译器选择 ====================
      compiler:
        description: "编译器"
        required: true
        type: choice
        options:
          - "clang-aosp (Google官方)"
          - "clang-neutron (Neutron优化版)"
          - "clang-zyc (ZyCromerZ)"
        default: "clang-aosp (Google官方)"
      clang_version:
        description: "自定义 Clang 版本 (可选，仅 Neutron/ZyC 生效，如 20250101 或 20.0.0-20250101)"
        required: false
        type: string
        default: ""

      # ★ ==================== sub_level 选择 ====================
      sub_level_select:
        description: "选择 sub_level（逗号分隔，如 23,58,92；留空或 all=全部）"
        required: false
        type: string
        default: "92"

      # ==================== 文本输入 ====================
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== 开关（默认关闭） ====================
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "启用 NoMount 挂载元模块"
        required: false
        type: boolean
        default: false
      use_networking:
        description: "启用网络增强（BBRv3 / IPSet / Qdisc / CIFS）"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: false
      supp_op:
        description: "启用一加 8E 支持"
        required: false
        type: boolean
        default: false
      droidspaces_ntsync:
        description: "启用 Droidspaces 容器 NTSync 支持（需启用 Droidspaces）"
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_kpm:
        required: true
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      use_nomount:
        required: false
        type: boolean
        default: false
      use_networking:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      ksu_mode:
        required: false
        type: string
        default: 关闭
      supp_op:
        required: false
        type: boolean
      droidspaces:
        required: false
        type: string
        default: "off"
      artifact_upload_mode:
        required: false
        type: string
        default: "上传全部"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      called_from_main:
        description: "是否从 main.yml 调用（内部使用）"
        required: false
        type: boolean
        default: false
      export_susfs_patches:
        description: "导出 SUSFS 集成补丁（由 main.yml 传入）"
        required: false
        type: boolean
        default: false
      # ★ 编译器配置（从 main.yml 传入）
      compiler:
        description: "编译器"
        required: false
        type: string
        default: "clang-aosp (Google官方)"
      clang_version:
        description: "自定义 Clang 版本 (可选)"
        required: false
        type: string
        default: ""
      sub_level_select:
        description: "选择 sub_level（逗号分隔，留空或 all=全部）"
        required: false
        type: string
        default: "all"

jobs:
  # ★ ============ 动态生成构建矩阵 ============
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: 生成构建矩阵
        id: gen
        env:
          SELECT: ${{ inputs.sub_level_select }}
        run: |
          FULL_LIST='[
            {"sub_level":"23","os_patch_level":"2025-06"},
            {"sub_level":"30","os_patch_level":"2025-07"},
            {"sub_level":"38","os_patch_level":"2025-09"},
            {"sub_level":"58","os_patch_level":"2025-12"},
            {"sub_level":"69","os_patch_level":"2026-03"},
            {"sub_level":"81","os_patch_level":"2026-06"},
            {"sub_level":"92","os_patch_level":"2026-09"}
          ]'

          SELECT_TRIMMED=$(echo "$SELECT" | xargs)

          if [[ -z "$SELECT_TRIMMED" || "$SELECT_TRIMMED" == "all" ]]; then
            MATRIX="$FULL_LIST"
          else
            MATRIX=$(echo "$FULL_LIST" | jq -c --arg sel "$SELECT_TRIMMED" '
              [.[] | select(
                (.sub_level as $sl |
                 ($sel | split(",") | map(gsub("^ +| +$";""))) | index($sl))
              )]')
          fi

          echo "matrix={\"include\":$MATRIX}" >> "$GITHUB_OUTPUT"
          echo "将构建以下版本: $MATRIX"

  # ★ 构建矩阵由 prepare-matrix 动态生成
  build-kernels-a16-6-12:
    name: "6.12.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build-G2.yml
    secrets: inherit
    with:
      android_version: "android16"
      kernel_version: "6.12"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: false
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      use_networking: ${{ inputs.use_networking || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches || false }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ inputs.ksu_mode != '禁用SUSFS' && inputs.ksu_mode != '禁用KSU' }}
      ksu_mode: ${{ inputs.ksu_mode || '关闭' }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      compiler: ${{ inputs.compiler || 'clang-aosp (Google官方)' }} # ★
      clang_version: ${{ inputs.clang_version || '' }}              # ★

  # 仅在直接触发时运行，从 main.yml 调用时跳过
  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
